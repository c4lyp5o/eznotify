# One workflow: test gate, then a branch-aware GHCR image — the ez house pattern.
#
#   test   Biome, production build, and the Bun suite. Runs on push, PR and on demand.
#   image  Builds and pushes the Docker image only on push, and only after `test`
#          passed. Tags say which branch produced it:
#            master       -> :master, :latest, :sha-<12>
#            development  -> :development, :sha-<12>   (never :latest)
#            vX.Y.Z tag   -> :<tag>, :sha-<12>
#
# Secrets used: NTFY_URL (optional — notify is skipped if unset).
name: CI

on:
  push:
    branches: [master, development]
    tags: ["v*"]
  pull_request:
    branches: [master, development]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: 🧾 Checkout source
        uses: actions/checkout@v4

      - name: 🟢 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: 📦 Install (frozen lockfile)
        run: bun install --frozen-lockfile --ignore-scripts

      - name: 🧹 Lint (Biome)
        run: bun run lint

      - name: 🌐 Production build
        run: bun run build

      - name: 🧪 Test suite
        run: bun test

  docker-test:
    name: Docker smoke test
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: 🧾 Checkout source
        uses: actions/checkout@v4

      - name: 🐳 Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🛠️ Build image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: eznotify:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🔬 Run container and check health and auth
        run: |
          set -euo pipefail
          admin=$(openssl rand -hex 24)
          key=$(openssl rand -base64 32)
          docker run -d --name ez -p 127.0.0.1:5099:5099 \
            -e EZNOTIFY_ADMIN_TOKEN="$admin" -e EZNOTIFY_ENCRYPTION_KEY="$key" \
            eznotify:ci
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:5099/healthz && break
            sleep 1
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5099/api/state)" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $admin" http://127.0.0.1:5099/api/state)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5099/)" = "200"
          test "$(docker exec ez id -u)" = "1000"

      - name: 🧾 Container logs on failure
        if: failure()
        run: docker logs ez || true

  image:
    name: Build & push GHCR image
    needs: [test, docker-test]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 🧾 Checkout source
        uses: actions/checkout@v4

      - name: 🏷️ Tags (branch-explicit)
        id: meta
        run: |
          set -euo pipefail
          img="ghcr.io/$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')/eznotify"
          sha=$(git rev-parse --short=12 HEAD)
          {
            echo "tags<<EOF"
            echo "${img}:sha-${sha}"
            case "${GITHUB_REF}" in
              refs/heads/master)      echo "${img}:master"; echo "${img}:latest" ;;
              refs/heads/development) echo "${img}:development" ;;
              refs/tags/*)            echo "${img}:${GITHUB_REF_NAME}" ;;
            esac
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: 🐳 Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🐳 Docker login (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🛠️ Build & push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.title=eznotify
            org.opencontainers.image.description=Multi-platform notification hub
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🔔 Notify ntfy
        if: always()
        env:
          NTFY_URL: ${{ secrets.NTFY_URL }}
        run: |
          if [ -n "$NTFY_URL" ]; then
            curl \
              -H "Title: Build ${{ job.status }}: eznotify:${{ github.ref_name }}" \
              -H "Priority: ${{ job.status == 'success' && 'default' || 'high' }}" \
              -H "Tags: ${{ job.status == 'success' && 'white_check_mark' || 'x' }},rocket" \
              -d "Branch: ${{ github.ref_name }} | Commit: ${{ github.sha }}" \
              "$NTFY_URL"
          fi
